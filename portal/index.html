<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070b14">
    <meta name="description" content="Butterfly Judger 題庫入口：選擇 TQC Python 或 Snakify C++ 題庫開始練習。">
    <title>Butterfly Judger｜選擇題庫</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Butterfly Judger 首頁">
        <span class="brand-mark" aria-hidden="true">B</span>
        <span>Butterfly Judger</span>
      </a>
      <span class="status">2 problem libraries</span>
    </header>
    <main>
      <div class="heading">
        <p class="eyebrow">PROBLEM LIBRARY</p>
        <h1>今天要練哪一套？</h1>
        <p>兩套題庫、兩種語言，各自保留完整的編輯器與判題流程。</p>
      </div>
      <section class="catalog-grid" aria-label="題庫選擇">
        <a class="catalog-card tqc" href="./tqc/">
          <span class="catalog-number">01</span>
          <span class="catalog-content">
            <span class="tag">PYTHON 3</span>
            <strong>TQC 題庫</strong>
            <span class="description">原有的九大單元與 90 題練習，使用瀏覽器內 Python 判題器。</span>
            <span class="enter">進入 TQC Python</span>
          </span>
          <span class="code-mark" aria-hidden="true">Py</span>
        </a>
        <a class="catalog-card cpp" href="./snakify-cpp/">
          <span class="catalog-number">02</span>
          <span class="catalog-content">
            <span class="tag">C++17</span>
            <strong>Snakify C++ 題庫</strong>
            <span class="description">Snakify Unit 1–11 的 112 道原題，以 C++17 編譯與公開測資判題。</span>
            <span class="enter">進入 Snakify C++</span>
          </span>
          <span class="code-mark" aria-hidden="true">C++</span>
        </a>
      </section>
    </main>
  </body>
</html>
