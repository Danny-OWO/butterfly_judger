name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "frontend/**"
      - "dist/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble problem libraries
        run: |
          mkdir -p _site/tqc _site/snakify-cpp
          cp -R portal/. _site/
          cp -R frontend/. _site/tqc/
          cp -R dist/. _site/snakify-cpp/
          cp frontend/api.js frontend/supabase-config.js _site/snakify-cpp/
      - name: Upload complete judge site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
